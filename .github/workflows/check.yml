name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyclone DDS (for the DDS interop test)
        run: python3 -m pip install --break-system-packages cyclonedds || python3 -m pip install cyclonedds
      - name: Host checks (cpp2hc, lint, HolyC unit tests, DDS interop, F32)
        run: tools/check.sh
