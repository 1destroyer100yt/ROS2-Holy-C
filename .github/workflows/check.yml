name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cyclone DDS, rosbags and mcap (for the interop tests)
        run: python3 -m pip install --break-system-packages cyclonedds rosbags mcap scapy pyfatfs 'setuptools<70' || python3 -m pip install cyclonedds rosbags mcap scapy pyfatfs 'setuptools<70'
      - name: Host checks (cpp2hc, lint, HolyC unit tests, DDS interop, F32)
        run: tools/check.sh
      - name: IP stack against the Linux kernel (TAP and SLIP, needs root)
        run: |
          sudo -E env "PATH=$PATH" tools/nettest/run.sh
          sudo -E env "PATH=$PATH" tools/nettest/run.sh slip
          sudo -E env "PATH=$PATH" tools/nettest/run.sh dhcp
      - name: e1000 driver on QEMU's emulated card (Linux guest, TAP, DHCP + echo suite)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86
          sudo -E env "PATH=$PATH" tools/e1000test/run.sh
      - name: DDS over our own IP stack with multicast (TAP, needs root)
        run: sudo -E env "PATH=$PATH" tools/ddstest/run.sh tap
  ros2:
    # The HolyC stack against a real ROS 2 Jazzy (Fast DDS and Cyclone DDS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: tools/ros2test/env.yml
          cache-environment: true
      - name: ros2 CLI <-> HolyC, HolyC -> Python nodes, rosbag2 both ways
        shell: bash -el {0}
        run: ROS_SETUP=$CONDA_PREFIX/setup.bash tools/ros2test/run.sh

