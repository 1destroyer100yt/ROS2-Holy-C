# ROS 2 Jazzy for tools/ros2test, from RoboStack (conda), no root needed:
#   micromamba create -y -p ./ros -f tools/ros2test/env.yml
#   ROS_SETUP=./ros/setup.bash tools/ros2test/run.sh
name: ros2test
channels:
  - robostack-jazzy
  - conda-forge
dependencies:
  - python=3.12
  - ros-jazzy-ros-base
  - ros-jazzy-rmw-cyclonedds-cpp
  - ros-jazzy-rmw-fastrtps-cpp
  - ros-jazzy-rosbag2
  - ros-jazzy-rosbag2-storage-mcap
  - ros-jazzy-example-interfaces
  - ros-jazzy-demo-nodes-py
  - ros-jazzy-action-tutorials-py
  - libpcap   # for scapy (tools/e1000test)
  - pip
  - pip:
    - scapy
